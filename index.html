<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080908" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("krish-theme");
          const theme = savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "light" ? "#ece9e1" : "#080908");
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <title>Krish Prajapati | Software Engineer</title>
    <meta
      name="description"
      content="Software engineer building reliable full stack applications, tested backend services, and production ready systems."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Krish Prajapati | Software Engineer" />
    <meta
      property="og:description"
      content="Full stack applications and backend systems built with React, Spring Boot, PostgreSQL, Docker, and production monitoring."
    />
    <meta property="og:site_name" content="Krish Prajapati" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Krish Prajapati | Software Engineer" />
    <meta
      name="twitter:description"
      content="Full stack applications and backend systems built with React, Spring Boot, PostgreSQL, and Docker."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
