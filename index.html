<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080908" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("krish-theme");
          const theme = savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "light" ? "#ece9e1" : "#080908");
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <title>Krish Prajapati | Software Engineer, Backend Focused</title>
    <meta
      name="description"
      content="Backend-focused software engineer building reliable full stack applications, tested Java services, and production-ready systems."
    />
